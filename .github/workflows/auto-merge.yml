name: Dependabot Auto-Merge

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Auto Merge Dependabot PRs
    runs-on: ubuntu-latest
    # Only run if the PR was created by dependabot
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Wait for CI to Pass
        # This prevents it from merging immediately before CI tests are done
        run: sleep 30

      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Merge PR Automatically
        # Only auto-merge patch and minor updates to be safe, or just merge everything if you want
        run: gh pr merge --merge --delete-branch "$PR_URL"
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
