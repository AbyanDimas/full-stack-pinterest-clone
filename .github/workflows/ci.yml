name: Full-Stack CI Pipeline

on:
  push:
    branches: [ "main", "master", "completed" ]
  pull_request:
    branches: [ "main", "master", "completed" ]
  schedule:
    - cron: '0 0 * * *'

jobs:
  # ==========================================
  # 0. AUTO FORMATTER (PRETTIER)
  # ==========================================
  format-code:
    name: Run Prettier Auto-Formatter
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: Format Frontend Code
        working-directory: ./client
        run: npx prettier --write "src/**/*.{js,jsx,css}"
      - name: Format Backend Code
        working-directory: ./backend
        run: npx prettier --write "**/*.{js,json}" "!node_modules/**"
      - name: Commit Formatted Changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "style: auto format code with prettier"
          branch: ${{ github.head_ref }}

  # ==========================================
  # 1. NPM AUDIT (SECURITY)
  # ==========================================
  npm-audit-backend:
    name: Backend Security Audit
    needs: format-code
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20.x'
    - name: Run NPM Audit
      continue-on-error: true
      run: npm audit --audit-level=high

  npm-audit-frontend:
    name: Frontend Security Audit
    needs: format-code
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client
    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20.x'
    - name: Run NPM Audit
      continue-on-error: true
      run: npm audit --audit-level=high

  # ==========================================
  # 2. TESTING & COVERAGE
  # ==========================================
  test-backend:
    name: Backend Tests & Coverage
    needs: npm-audit-backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: './backend/package-lock.json'
    - name: Install dependencies
      run: npm ci || npm install
    - name: Run Backend Tests with Coverage
      run: npx vitest run --coverage

  test-frontend:
    name: Frontend Tests & Build Check
    needs: npm-audit-frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client
    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: './client/package-lock.json'
    - name: Install dependencies
      run: npm ci || npm install
    - name: Run Frontend Tests with Coverage
      run: npx vitest run --coverage
    - name: Check Build
      run: npm run build

  # ==========================================
  # 3. CODEQL (DEEP SECURITY SCAN)
  # ==========================================
  analyze-codeql:
    name: CodeQL Security Analysis
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  # ==========================================
  # 4. LIGHTHOUSE PERFORMANCE
  # ==========================================
  lighthouse-check:
    name: Lighthouse Performance Check
    needs: test-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20.x'
      - name: Install and Build Frontend
        working-directory: ./client
        run: |
          npm ci || npm install
          npm run build
      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: './client/lighthouserc.json'
          uploadArtifacts: true
          temporaryPublicStorage: true

  # ==========================================
  # 5. DOCKER BUILD & PUSH
  # ==========================================
  build-backend-docker:
    name: Build & Push Backend Docker Image
    needs: test-backend
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository
      uses: actions/checkout@v7
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Build and Push Backend Image
      uses: docker/build-push-action@v7
      with:
        context: ./backend
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/full-stack-pinterest-backend:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

  build-frontend-docker:
    name: Build & Push Frontend Docker Image
    needs: test-frontend
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository
      uses: actions/checkout@v7
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Build and Push Frontend Image
      uses: docker/build-push-action@v7
      with:
        context: ./client
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/full-stack-pinterest-frontend:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # ==========================================
  # 6. SEMANTIC RELEASE
  # ==========================================
  release:
    name: Generate Automatic Release
    # Release only happens if EVERYTHING else passes successfully!
    needs: [analyze-codeql, lighthouse-check, build-backend-docker, build-frontend-docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20.x'
      - name: Run Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
