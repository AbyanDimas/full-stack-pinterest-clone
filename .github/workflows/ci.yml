name: Full-Stack CI Pipeline

on:
  push:
    branches: [ "main", "master", "completed" ]
  pull_request:
    branches: [ "main", "master", "completed" ]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  # ==========================================
  # 0. AUTO FORMATTER (PRETTIER)
  # ==========================================
  format-code:
    name: Run Prettier Auto-Formatter
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: Format Frontend Code
        working-directory: ./client
        run: npx prettier --write "src/**/*.{js,jsx,css}"
      - name: Format Backend Code
        working-directory: ./backend
        run: npx prettier --write "**/*.{js,json}" "!node_modules/**"
      - name: Commit Formatted Changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "style: auto format code with prettier"
          branch: ${{ github.head_ref }}

  secret-scanning:
    name: Secret Scanning (TruffleHog)
    needs: format-code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ""
          head: ${{ github.ref_name }}
          extra_args: --debug --only-verified

  # ==========================================
  # 1. NPM AUDIT (SECURITY)
  # ==========================================
  npm-audit-backend:
    name: Backend Security Audit
    needs: [format-code, secret-scanning]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20.x'
    - name: Run NPM Audit
      continue-on-error: true
      run: npm audit --audit-level=high

  npm-audit-frontend:
    name: Frontend Security Audit
    needs: [format-code, secret-scanning]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client
    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20.x'
    - name: Run NPM Audit
      continue-on-error: true
      run: npm audit --audit-level=high

  # ==========================================
  # 2. TESTING & COVERAGE
  # ==========================================
  test-backend:
    name: Backend Tests & Coverage
    needs: npm-audit-backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: './backend/package-lock.json'
    - name: Install dependencies
      run: npm ci || npm install
    - name: Run Backend Tests with Coverage
      run: npx vitest run --coverage

  test-frontend:
    name: Frontend Tests & Build Check
    needs: npm-audit-frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client
    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: './client/package-lock.json'
    - name: Install dependencies
      run: npm ci || npm install
    - name: Run Frontend Tests with Coverage
      run: npx vitest run --coverage
    - name: Check Build
      run: npm run build

  # ==========================================
  # 3. CODEQL (DEEP SECURITY SCAN)
  # ==========================================
  analyze-codeql:
    name: CodeQL Security Analysis
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  # ==========================================
  # 4. LIGHTHOUSE PERFORMANCE
  # ==========================================
  lighthouse-check:
    name: Lighthouse Performance Check
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20.x'
      - name: Install and Build Frontend
        working-directory: ./client
        run: |
          npm ci || npm install
          npm run build
      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: './client/lighthouserc.json'
          uploadArtifacts: true
          temporaryPublicStorage: true

  # ==========================================
  # 5. DOCKER BUILD & PUSH
  # ==========================================
  build-backend-docker:
    name: Build & Push Backend Docker Image
    needs: [analyze-codeql, lighthouse-check]
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository
      uses: actions/checkout@v7
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Build and Push Backend Image
      uses: docker/build-push-action@v7
      with:
        context: ./backend
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/full-stack-pinterest-backend:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/full-stack-pinterest-backend:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  build-frontend-docker:
    name: Build & Push Frontend Docker Image
    needs: [analyze-codeql, lighthouse-check]
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository
      uses: actions/checkout@v7
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Build and Push Frontend Image
      uses: docker/build-push-action@v7
      with:
        context: ./client
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/full-stack-pinterest-frontend:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/full-stack-pinterest-frontend:${{ github.sha }}
        build-args: |
          VITE_API_ENDPOINT=${{ secrets.VITE_API_ENDPOINT }}
          VITE_IMGPROXY_URL=${{ secrets.VITE_IMGPROXY_URL }}
          VITE_MINIO_BUCKET=${{ secrets.VITE_MINIO_BUCKET }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # ==========================================
  # 6. CDK8S SYNTH CHECK
  # ==========================================
  cdk8s-synth:
    name: Build & Synth CDK8s YAML
    needs: [build-backend-docker, build-frontend-docker]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./k8s
    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: './k8s/package-lock.json'
    - name: Install dependencies
      run: npm ci || npm install
    - name: Run CDK8s Compile
      run: npm run compile
    - name: Run CDK8s Synth
      env:
        DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        IMAGE_TAG: ${{ github.sha }}
      run: npm run synth

  # ==========================================
  # 7. SEMANTIC RELEASE
  # ==========================================
  release:
    name: Generate Automatic Release
    # Release only happens if EVERYTHING else passes successfully!
    needs: [cdk8s-synth]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20.x'
      - name: Run Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
      - name: Build & Attach Kubernetes YAML to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Wait a few seconds for semantic-release to finish creating the release in GitHub
          sleep 5
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ ! -z "$LATEST_TAG" ]; then
            echo "Building CDK8s YAML for release..."
            cd k8s
            npm ci || npm install
            npm run synth
            cd ..

            echo "Generating checksums for integrity verification..."
            sha256sum ./k8s/dist/pinterest-k8s.k8s.yaml > checksums.txt

            echo "Uploading Kubernetes YAML and Checksums as Release Assets..."
            gh release upload $LATEST_TAG ./k8s/dist/pinterest-k8s.k8s.yaml checksums.txt || echo "Failed to upload assets"

            echo "Extracting Stack Versions..."
            REACT_VERSION=$(jq -r '.dependencies.react' client/package.json | tr -d '^~')
            EXPRESS_VERSION=$(jq -r '.dependencies.express' backend/package.json | tr -d '^~')
            NODE_VERSION=$(node -v)

            echo "Appending Docker, K8s, Stack, & Security info to release $LATEST_TAG"
            export LATEST_TAG
            export NODE_VERSION
            export REACT_VERSION
            export EXPRESS_VERSION
            export GITHUB_REPOSITORY=${{ github.repository }}
            echo "## 🌍 Live URL" > release_notes.txt
            echo "The application is successfully deployed and live at: **[https://pinterest.abyandimas.me](https://pinterest.abyandimas.me)**" >> release_notes.txt
            echo "" >> release_notes.txt
            echo "## 🐳 Docker Images" >> release_notes.txt
            echo "Images have been successfully pushed to Docker Hub and are ready for deployment:" >> release_notes.txt
            echo "- **Frontend**: \`${DOCKERHUB_USERNAME}/full-stack-pinterest-frontend:${IMAGE_TAG}\`" >> release_notes.txt
            echo "- **Backend**: \`${DOCKERHUB_USERNAME}/full-stack-pinterest-backend:${IMAGE_TAG}\`" >> release_notes.txt
            echo "" >> release_notes.txt
            echo "## ☸️ Kubernetes Deployment" >> release_notes.txt
            echo "The complete Kubernetes configuration for this version has been generated and attached as a release asset." >> release_notes.txt
            echo "To deploy this exact release to your cluster, run:" >> release_notes.txt
            echo "\`\`\`bash" >> release_notes.txt
            echo "kubectl apply -f https://github.com/${GITHUB_REPOSITORY}/releases/download/${LATEST_TAG}/pinterest-k8s.k8s.yaml" >> release_notes.txt
            echo "\`\`\`" >> release_notes.txt
            echo "" >> release_notes.txt
            echo "## 🛠️ Stack Versions" >> release_notes.txt
            echo "- **Node.js**: \`${NODE_VERSION}\`" >> release_notes.txt
            echo "- **React**: \`${REACT_VERSION}\`" >> release_notes.txt
            echo "- **Express**: \`${EXPRESS_VERSION}\`" >> release_notes.txt
            echo "" >> release_notes.txt
            echo "## 🔒 Security & Integrity (SLSA)" >> release_notes.txt
            echo "- ✅ **CodeQL Scanning**: Passed" >> release_notes.txt
            echo "- ✅ **Secret Scanning (TruffleHog)**: Passed" >> release_notes.txt
            echo "- ✅ **Unit Tests**: Passed" >> release_notes.txt
            echo "- 🛡️ **Asset Integrity**: Download \`checksums.txt\` to verify the YAML artifact's SHA256 checksum." >> release_notes.txt
            
            # Also append to GitHub Step Summary so it shows on the Actions UI
            cat release_notes.txt >> $GITHUB_STEP_SUMMARY
            
            gh release edit $LATEST_TAG --notes-file release_notes.txt || echo "Failed to edit release notes, but semantic release succeeded."
          fi

      - name: 📤 Upload K8s Manifest Artifact
        uses: actions/upload-artifact@v7
        with:
          name: k8s-manifest
          path: ./k8s/dist/pinterest-k8s.k8s.yaml

  # ==========================================
  # GITOPS DEPLOYMENT JOB
  # ==========================================
  deploy-gitops:
    name: Deploy to GitOps Repo
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Download K8s Manifest Artifact
        uses: actions/download-artifact@v4
        with:
          name: k8s-manifest
          path: ./k8s-manifest-dir

      - name: 🚀 Push to GitOps Deployment Repo
        env:
          GITOPS_PAT: ${{ secrets.GITOPS_PAT }}
        run: |
          echo "Pushing latest K8s manifest to deployment repository..."
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          
          # Clone the deployment repo
          git clone https://$GITOPS_PAT@github.com/${{ github.actor }}/full-stack-pinterest-deployment.git deploy-repo
          
          # Copy the newly generated YAML
          cp ./k8s-manifest-dir/pinterest-k8s.k8s.yaml ./deploy-repo/k8s-manifest.yaml
          
          # Commit and push
          cd deploy-repo
          git add k8s-manifest.yaml
          
          if git diff --staged --quiet; then
            echo "No changes in K8s manifest, skipping GitOps push."
          else
            git commit -m "chore(gitops): update k8s manifest to commit ${{ github.sha }}"
            git push origin main
            echo "Successfully pushed to GitOps repository!"
          fi
