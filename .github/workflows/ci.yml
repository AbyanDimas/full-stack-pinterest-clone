name: Full-Stack CI Pipeline

on:
  push:
    branches: [ "main", "master", "completed" ]
  pull_request:
    branches: [ "main", "master", "completed" ]
  schedule:
    # Run a security scan every night at midnight UTC
    - cron: '0 0 * * *'

jobs:
  # ==========================================
  # 1. NPM AUDIT (SECURITY)
  # ==========================================
  npm-audit-backend:
    name: Backend Security Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
    - name: Run NPM Audit
      continue-on-error: true
      run: npm audit --audit-level=high

  npm-audit-frontend:
    name: Frontend Security Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
    - name: Run NPM Audit
      continue-on-error: true
      run: npm audit --audit-level=high

  # ==========================================
  # 2. TESTING & COVERAGE
  # ==========================================
  test-backend:
    name: Backend Tests & Coverage
    needs: npm-audit-backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: './backend/package-lock.json'
    - name: Install dependencies
      run: npm ci || npm install
    - name: Run Backend Tests with Coverage
      run: npx vitest run --coverage

  test-frontend:
    name: Frontend Tests & Build Check
    needs: npm-audit-frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: './client/package-lock.json'
    - name: Install dependencies
      run: npm ci || npm install
    - name: Run Frontend Tests with Coverage
      run: npx vitest run --coverage
    - name: Check Build
      run: npm run build

  # ==========================================
  # 3. LIGHTHOUSE PERFORMANCE
  # ==========================================
  lighthouse-check:
    name: Lighthouse Performance Check
    needs: build-frontend-docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: Install and Build Frontend
        working-directory: ./client
        run: |
          npm ci || npm install
          npm run build
      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: './client/lighthouserc.json'
          uploadArtifacts: true
          temporaryPublicStorage: true

  # ==========================================
  # 4. DOCKER BUILD CHECK
  # ==========================================
  build-backend-docker:
    name: Build Backend Docker Image
    needs: test-backend
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository
      uses: actions/checkout@v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Build Backend Image
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        push: false
        tags: full-stack-pinterest-backend:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

  build-frontend-docker:
    name: Build Frontend Docker Image
    needs: test-frontend
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository
      uses: actions/checkout@v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Build Frontend Image
      uses: docker/build-push-action@v5
      with:
        context: ./client
        push: false
        tags: full-stack-pinterest-frontend:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
