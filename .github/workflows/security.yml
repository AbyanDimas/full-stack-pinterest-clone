name: Security Audit

on:
  push:
    branches: [ "main", "master", "completed" ]
  pull_request:
    branches: [ "main", "master", "completed" ]
  schedule:
    # Run a security scan every night at midnight UTC
    - cron: '0 0 * * *'

jobs:
  npm-audit-backend:
    name: Backend NPM Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
    - name: Run NPM Audit
      # We use --audit-level=high to only fail on high/critical vulnerabilities
      # continue-on-error makes this optional (won't fail the pipeline if vulnerabilities exist)
      continue-on-error: true
      run: npm audit --audit-level=high

  npm-audit-frontend:
    name: Frontend NPM Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
    - name: Run NPM Audit
      continue-on-error: true
      run: npm audit --audit-level=high
