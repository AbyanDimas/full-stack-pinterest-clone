name: Auto Format Code

on:
  push:
    branches: [ "main", "master", "completed" ]
    
permissions:
  contents: write

jobs:
  format:
    name: Run Prettier Auto-Formatter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # Important for git-auto-commit
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Format Frontend Code
        working-directory: ./client
        run: npx prettier --write "src/**/*.{js,jsx,css}"

      - name: Format Backend Code
        working-directory: ./backend
        run: npx prettier --write "**/*.{js,json}" "!node_modules/**"

      - name: Commit Formatted Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: auto format code with prettier"
          branch: ${{ github.head_ref }}
